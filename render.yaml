# Render Blueprint for MrStockd.
# Secrets use `sync: false`: you enter them in the Render dashboard, they are
# never committed to this public repo.

# Shared by web (encrypts sellers' secrets) and gateway (decrypts them).
envVarGroups:
  - name: mrstockd-shared
    envVars:
      - key: UPSTREAM_SECRET_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: mrstockd-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only

services:
  - type: web
    name: mrstockd-web
    runtime: node
    plan: free # upgrade before judging (Dec 1) to avoid cold starts
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mrstockd/web... build
    startCommand: pnpm --filter @mrstockd/web start
    # Paid instances can run migrations automatically before each deploy:
    # preDeployCommand: pnpm db:migrate
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mrstockd-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false # the web service's public URL, e.g. https://mrstockd-web.onrender.com
      - key: GATEWAY_PUBLIC_URL
        sync: false # the gateway's public URL, e.g. https://mrstockd-gateway.onrender.com
      - key: ADMIN_EMAILS
        sync: false # who can review listings, comma-separated
      - key: DATABASE_POOL_MAX
        value: "5"
      - fromGroup: mrstockd-shared
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: mrstockd-gateway
    runtime: node
    plan: free # upgrade before judging
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mrstockd/gateway... build
    startCommand: node apps/gateway/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mrstockd-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - fromGroup: mrstockd-shared
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: TRUST_PROXY
        value: "true"
      # Public addresses, used in links the API and MCP server hand out.
      - key: GATEWAY_PUBLIC_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
